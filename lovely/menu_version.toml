[manifest]
version = "1.0.0"
dump_lua = true
priority = 0

[[patches]]
[patches.pattern]
target = "game.lua"
pattern = '{n=G.UIT.T, config={text = G.VERSION, scale = 0.3, colour = G.C.UI.TEXT_LIGHT}}'
position = "at"
match_indent = true
payload = '{n=G.UIT.T, config={text = BUC11 and "1.1-TEST" or G.VERSION, scale = 0.3, colour = G.C.UI.TEXT_LIGHT}}'
